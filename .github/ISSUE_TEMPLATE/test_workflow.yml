name: Curation Update
description: Add or update features and publications
labels: ["curation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to automatically append a new row to a `.tsv` file.

        **Existing file**: type an existing path to append new data.
        **New file**: type a new path to create it.
  - type: input
    id: target_file
    attributes:
      label: Target Curation File
      description: |
        Relative path to the target `.tsv` file in the repository.
        Examples:
          - `Scripts/PlantSEED_v3/Curation/Curators/seaver/test.tsv`
          - `Scripts/PlantSEED_v3/Curation/Curators/pelle283/Glucosinolates/NewStep.tsv`
    validations:
      required: true
  - type: input
    id: entity
    attributes:
      label: Entity Name / Pathway
      description: e.g., Glucosinolate gamma-glutamyl hydrolase (EC 3.4.19.16)
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - ADD
        - UPDATE
    validations:
      required: true
  - type: dropdown
    id: data_type
    attributes:
      label: Data Type
      options:
        - features
        - publications
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Value(s)
      description: |
        One per line. Examples:
          - Athaliana_TAIR10||AT4G30530
          - 10.1038/nchembio.185
      placeholder: |
        Athaliana_TAIR10||AT4G30530
        10.1038/nchembio.185
    validations:
      required: true